# 순간 최대 환산의 초기 가정이며 docs/plan/06 §4를 따른다.
peak_day:
  id: as-peak-day-factor # 기준 그래프의 가정 식별자
  one_day: 1.0 # 가정: 1일 행사
  two_or_three_days: 1.3 # 가정: 2~3일 행사
  four_or_more_days: 1.5 # 가정: 4일 이상 행사
  weekend_increment: 0.1 # 가정: 한국 날짜로 주말을 포함할 때 가산
  half_range: 0.2 # 가정: 중심값 ±0.2에서 균등 샘플링
stay_half_range: 0.2 # 가정: 체류시간 ±20%에서 균등 샘플링 후 동시체류율 상한 1 적용
profiles:
  불꽃:
    id: as-concurrency-fireworks # 기준 그래프의 가정 식별자
    operating_hours: 3 # 가정: docs/plan/06 §4 불꽃·드론쇼
    stay_hours: 2.5 # 가정: 평균 체류시간
    peak_factor: 1.2 # 가정: 시간대 집중 계수
  공연:
    id: as-concurrency-performance # 기준 그래프의 가정 식별자
    operating_hours: 4 # 가정: docs/plan/06 §4 공연·음악
    stay_hours: 3 # 가정: 평균 체류시간
    peak_factor: 1.2 # 가정: 시간대 집중 계수
  대학:
    id: as-concurrency-university # 기준 그래프의 가정 식별자
    operating_hours: 6 # 가정: docs/plan/06 §4 대학 축제
    stay_hours: 3 # 가정: 평균 체류시간
    peak_factor: 1.4 # 가정: 시간대 집중 계수
  먹거리:
    id: as-concurrency-food # 기준 그래프의 가정 식별자
    operating_hours: 10 # 가정: docs/plan/06 §4 먹거리·장터
    stay_hours: 2 # 가정: 평균 체류시간
    peak_factor: 1.8 # 가정: 시간대 집중 계수
  꽃:
    id: as-concurrency-flower # 기준 그래프의 가정 식별자
    operating_hours: 9 # 가정: docs/plan/06 §4 꽃·자연
    stay_hours: 1.5 # 가정: 평균 체류시간
    peak_factor: 2 # 가정: 시간대 집중 계수
  전통:
    id: as-concurrency-traditional # 기준 그래프의 가정 식별자
    operating_hours: 8 # 가정: docs/plan/06 §4, 2026-09-24 확정
    stay_hours: 2 # 가정: 평균 체류시간
    peak_factor: 1.6 # 가정: 시간대 집중 계수
  기타:
    id: as-concurrency-other # 기준 그래프의 가정 식별자
    operating_hours: 8 # 가정: docs/plan/06 §4, 2026-09-24 확정
    stay_hours: 2.5 # 가정: 유형 불명일 때 체류시간을 보수적으로 적용
    peak_factor: 1.6 # 가정: 시간대 집중 계수
