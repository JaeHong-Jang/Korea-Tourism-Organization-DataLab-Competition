# 근거 그래프 서비스 패키지 — 온톨로지·SHACL·SPARQL (레인 L6, 이 파일은 오케스트레이터 소유)
[project]
name = "crowdcast-knowledge"
version = "0.1.0"
description = "인파예보 근거 그래프 서비스"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.8",
  "orjson>=3.10",
  "rdflib>=7.0",
  "pyshacl>=0.26",
  "pyoxigraph>=0.4",
  "python-dotenv>=1.0",
  "jsonschema>=4.23",
]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6", "httpx>=0.27"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/knowledge"]

[tool.pytest.ini_options]
testpaths = ["tests"]
